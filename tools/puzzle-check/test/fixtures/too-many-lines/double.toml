function = "double"
prompt = "Return x times two."

[[tests]]
args = [2]
expected = 4

[javascript]
signature = "double(x)"
reference = '''
function double(x) {
  let a = x;
  a = a + 0;
  a = a + 0;
  a = a + 0;
  a = a + 0;
  a = a + 0;
  a = a + 0;
  a = a + 0;
  a = a + 0;
  a = a + 0;
  return a * 2;
}
'''

[purescript]
signature = '''
double :: Int -> Int
double x = ...'''
reference = '''
import Prelude

double :: Int -> Int
double x = twice
  where
    -- Doubles its argument, then returns it to the caller.
    twice = x * 2
'''
