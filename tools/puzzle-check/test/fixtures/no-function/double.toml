args = [2]
expected = 4

[javascript]
signature = "double(x)"
reference = '''
function triple(x) {
  const thrice = x * 3;
  // Defines triple, not double, so the tests can't call it.
  return thrice;
}
'''

[purescript]
signature = "double :: Int -> Int"
reference = """
import Prelude

double :: Int -> Int
double x = x * 2
"""
