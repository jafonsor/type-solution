function = "pair"
prompt = "Return {b: x, a: y}."

[[tests]]
args = [1, 2]
expected = { a = 2, b = 1 }

[javascript]
signature = "pair(x, y)"
reference = '''
function pair(x, y) {
  // Builds the object with its keys out of sorted order on purpose.
  const result = { b: x, a: y };
  return result;
}
'''

[purescript]
signature = "x :: Int"
reference = """
import Prelude

x :: Int
x = 1
"""
