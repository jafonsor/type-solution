function = "double"
prompt = "Return x times two."

tests = []

[javascript]
signature = "double(x)"
reference = '''
function double(x) {
  const twice = x * 2;
  // Doubles its argument, then returns it to the caller.
  return twice;
}
'''

[purescript]
signature = '''
double :: Int -> Int
double x = ...'''
reference = '''
import Prelude

double :: Int -> Int
double x = twice
  where
    -- Doubles its argument, then returns it to the caller.
    twice = x * 2
'''
