function = "keys"
prompt = "Return the object's keys."

[[tests]]
args = [{ b = 1, a = 2 }]
expected = ["b", "a"]

[javascript]
signature = "keys(obj)"
reference = '''
function keys(obj) {
  // Depends on the order the argument's keys arrive in, which the file
  // order doesn't decide: the app sends them sorted.
  return Object.keys(obj);
}
'''

[purescript]
signature = '''
x :: Int
x = ...'''
reference = '''
import Prelude

x :: Int
x = one
  where
    -- A constant that these tests never call: the check only reads this Language table's text.
    one = 1
'''
