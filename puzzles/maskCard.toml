function = "maskCard"
prompt = """
Hide every character of a card number except the last four by turning it \
into *; a number of four characters or fewer stays as it is. For example, \
maskCard("1234567812345678") → "************5678"."""

[[tests]]
args = ["1234567812345678"]
expected = "************5678"

[[tests]]
args = ["98765"]
expected = "*8765"

[[tests]]
args = ["1234"]
expected = "1234"

[[tests]]
args = ["12"]
expected = "12"

[javascript]
signature = "maskCard(number)"
reference = '''
function maskCard(number) {
  const hidden = number.length - 4;
  if (hidden <= 0) return number;
  return '*'.repeat(hidden) + number.slice(-4);
}
'''

[purescript]
signature = '''
maskCard :: String -> String
maskCard number = ...'''
reference = '''
import Prelude
import Data.Array (replicate)
import Data.String.CodeUnits (drop, fromCharArray, length)

maskCard :: String -> String
maskCard number = if hidden <= 0 then number else stars <> drop hidden number
  where
    hidden = length number - 4
    stars = fromCharArray $ replicate hidden '*'
'''
