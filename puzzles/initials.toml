function = "initials"
prompt = """
Return the upper-case first letter of each word in a name, each followed \
by a dot: initials("ada lovelace") → "A.L.". Words are separated by \
single spaces."""

[[tests]]
args = ["ada lovelace"]
expected = "A.L."

[[tests]]
args = ["Grace Brewster Hopper"]
expected = "G.B.H."

[[tests]]
args = ["linus"]
expected = "L."

[javascript]
signature = "initials(name)"
reference = '''
function initials(name) {
  return name
    .split(' ')
    .map((word) => word[0].toUpperCase() + '.')
    .join('');
}
'''

