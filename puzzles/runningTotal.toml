function = "runningTotal"
prompt = """
Return a list where each item is the sum of the numbers up to and \
including that position. For example, [1,2,3,4] → [1,3,6,10]."""

[[tests]]
args = [[1, 2, 3, 4]]
expected = [1, 3, 6, 10]

[[tests]]
args = [[5, -2, 7]]
expected = [5, 3, 10]

[[tests]]
args = [[42]]
expected = [42]

[javascript]
signature = "runningTotal(nums)"
reference = '''
function runningTotal(nums) {
  const totals = [];
  let sum = 0;
  for (const n of nums) {
    sum += n;
    totals.push(sum);
  }
  return totals;
}
'''

[purescript]
signature = '''
runningTotal :: Array Int -> Array Int
runningTotal nums = ...'''
reference = '''
import Prelude
import Data.Traversable (scanl)

runningTotal :: Array Int -> Array Int
runningTotal nums = scanl plus 0 nums
  where
    plus total n = total + n
'''
