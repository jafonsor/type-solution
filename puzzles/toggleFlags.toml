function = "toggleFlags"
prompt = """
Return a copy of an object of true/false flags with each named flag \
flipped; a named flag that is missing counts as false. For example, \
{dark: false, sound: true}, ["dark"] → {dark: true, sound: true}."""

[[tests]]
args = [{ dark = false, sound = true }, ["dark"]]
expected = { dark = true, sound = true }

[[tests]]
args = [{ a = true, b = true }, ["a", "b"]]
expected = { a = false, b = false }

[[tests]]
args = [{ wifi = true }, ["bluetooth"]]
expected = { wifi = true, bluetooth = true }

[javascript]
signature = "toggleFlags(flags, names)"
reference = '''
function toggleFlags(flags, names) {
  const result = { ...flags };
  for (const name of names) {
    result[name] = !result[name];
  }
  return result;
}
'''

[purescript]
signature = '''
toggleFlags :: Object Boolean -> Array String -> Object Boolean
toggleFlags flags names = ...'''
reference = '''
import Prelude
import Data.Foldable (foldl)
import Data.Maybe (Maybe(..), fromMaybe)
import Foreign.Object (Object, alter)

toggleFlags :: Object Boolean -> Array String -> Object Boolean
toggleFlags flags names = foldl toggle flags names
  where
    toggle result name = alter (\flag -> Just (not (fromMaybe false flag))) name result
'''
