function = "rockPaperScissors"
signature = "rockPaperScissors(a, b)"
prompt = """
Return "win" if move a beats move b, "lose" if b beats a, and "draw" if they \
are the same; rock beats scissors, scissors beats paper, paper beats rock. \
For example, rockPaperScissors("rock", "scissors") → "win"."""

reference = '''
function rockPaperScissors(a, b) {
  if (a === b) return "draw";
  const wins =
    (a === "rock" && b === "scissors") ||
    (a === "scissors" && b === "paper") ||
    (a === "paper" && b === "rock");
  return wins ? "win" : "lose";
}
'''

[[tests]]
args = ["rock", "scissors"]
expected = "win"

[[tests]]
args = ["rock", "paper"]
expected = "lose"

[[tests]]
args = ["paper", "rock"]
expected = "win"

[[tests]]
args = ["scissors", "rock"]
expected = "lose"

[[tests]]
args = ["paper", "paper"]
expected = "draw"
