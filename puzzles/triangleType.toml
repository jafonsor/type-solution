function = "triangleType"
prompt = """
Name a triangle by its side lengths: "equilateral" if all three are equal, \
"isosceles" if exactly two are, otherwise "scalene". For example, \
3, 3, 5 → "isosceles"."""

[[tests]]
args = [3, 3, 5]
expected = "isosceles"

[[tests]]
args = [4, 4, 4]
expected = "equilateral"

[[tests]]
args = [3, 4, 5]
expected = "scalene"

[[tests]]
args = [5, 2, 5]
expected = "isosceles"

[[tests]]
args = [6, 7, 7]
expected = "isosceles"

[javascript]
signature = "triangleType(a, b, c)"
reference = '''
function triangleType(a, b, c) {
  if (a === b && b === c) return 'equilateral';
  if (a === b || b === c || a === c) return 'isosceles';
  return 'scalene';
}
'''

[purescript]
signature = '''
triangleType :: Int -> Int -> Int -> String
triangleType a b c = ...'''
reference = '''
import Prelude

triangleType :: Int -> Int -> Int -> String
triangleType a b c
  | a == b && b == c = "equilateral"
  | a == b || b == c || a == c = "isosceles"
  | otherwise = "scalene"
'''
