function = "queryString"
prompt = """
Build a query string from an object: each key and value joined by =, the \
pairs joined by &, keys in alphabetical order; an empty object gives "". \
For example, queryString({q: "cats", page: 2}) → "page=2&q=cats"."""

[[tests]]
args = [{ q = "cats", page = 2 }]
expected = "page=2&q=cats"

[[tests]]
args = [{ size = "large", color = "red", qty = 3 }]
expected = "color=red&qty=3&size=large"

[[tests]]
args = [{ id = 7 }]
expected = "id=7"

[[tests]]
args = [{}]
expected = ""

[javascript]
signature = "queryString(params)"
reference = '''
function queryString(params) {
  return Object.keys(params)
    .sort()
    .map((key) => `${key}=${params[key]}`)
    .join('&');
}
'''

