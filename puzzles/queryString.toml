function = "queryString"
prompt = """
Build a query string from an object: each key and value joined by =, the \
pairs joined by &, keys in alphabetical order; an empty object gives "". \
For example, queryString({q: "cats", page: 2}) → "page=2&q=cats"."""

[[tests]]
args = [{ q = "cats", page = 2 }]
expected = "page=2&q=cats"

[[tests]]
args = [{ size = "large", color = "red", qty = 3 }]
expected = "color=red&qty=3&size=large"

[[tests]]
args = [{ id = 7 }]
expected = "id=7"

[[tests]]
args = [{}]
expected = ""

[javascript]
signature = "queryString(params)"
reference = '''
function queryString(params) {
  return Object.keys(params)
    .sort()
    .map((key) => `${key}=${params[key]}`)
    .join('&');
}
'''

[purescript]
signature = '''
queryString :: Object Json -> String
queryString params = ...'''
reference = '''
import Prelude
import Data.Argonaut.Core (Json, stringify, toString)
import Data.Maybe (fromMaybe)
import Data.String (joinWith)
import Data.Tuple (Tuple(..))
import Foreign.Object (Object, toAscUnfoldable)

queryString :: Object Json -> String
queryString params = joinWith "&" (map pair pairs)
  where
    pairs = toAscUnfoldable params :: Array (Tuple String Json)
    pair (Tuple key value) = key <> "=" <> fromMaybe (stringify value) (toString value)
'''
