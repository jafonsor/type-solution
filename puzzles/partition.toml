function = "partition"
prompt = """
Split a list into two lists: the numbers below the pivot, then the rest \
(including any equal to it), each in its original order. For example, \
[5,1,8,3], 4 → [[1,3],[5,8]]."""

[[tests]]
args = [[5, 1, 8, 3], 4]
expected = [[1, 3], [5, 8]]

[[tests]]
args = [[4, 2, 4, 6], 4]
expected = [[2], [4, 4, 6]]

[[tests]]
args = [[9, 7], 1]
expected = [[], [9, 7]]

[javascript]
signature = "partition(nums, pivot)"
reference = '''
function partition(nums, pivot) {
  const below = [];
  const rest = [];
  for (const n of nums) {
    if (n < pivot) below.push(n);
    else rest.push(n);
  }
  return [below, rest];
}
'''

[purescript]
signature = '''
partition :: Array Int -> Int -> Array (Array Int)
partition nums pivot = ...'''
reference = '''
import Prelude
import Data.Array (filter)

partition :: Array Int -> Int -> Array (Array Int)
partition nums pivot = [below, rest]
  where
    below = filter (_ < pivot) nums
    rest = filter (\n -> n >= pivot) nums
'''
