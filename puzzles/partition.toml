function = "partition"
signature = "partition(nums, pivot)"
prompt = """
Split a list into two lists: the numbers below the pivot, then the rest \
(including any equal to it), each in its original order. For example, \
partition([5,1,8,3], 4) → [[1,3],[5,8]]."""

reference = '''
function partition(nums, pivot) {
  const below = [];
  const rest = [];
  for (const n of nums) {
    if (n < pivot) below.push(n);
    else rest.push(n);
  }
  return [below, rest];
}
'''

[[tests]]
args = [[5, 1, 8, 3], 4]
expected = [[1, 3], [5, 8]]

[[tests]]
args = [[4, 2, 4, 6], 4]
expected = [[2], [4, 4, 6]]

[[tests]]
args = [[9, 7], 1]
expected = [[], [9, 7]]
