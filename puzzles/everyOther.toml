function = "everyOther"
prompt = """
Return the items at positions 0, 2, 4 and so on, counting from 0. \
For example, ["a","b","c","d","e"] → ["a","c","e"]."""

[[tests]]
args = [["a", "b", "c", "d", "e"]]
expected = ["a", "c", "e"]

[[tests]]
args = [[1, 2, 3, 4]]
expected = [1, 3]

[[tests]]
args = [[9]]
expected = [9]

[javascript]
signature = "everyOther(items)"
reference = '''
function everyOther(items) {
  const picked = [];
  for (let i = 0; i < items.length; i += 2) {
    picked.push(items[i]);
  }
  return picked;
}
'''

[purescript]
signature = '''
everyOther :: forall a. Array a -> Array a
everyOther items = ...'''
reference = '''
import Prelude
import Data.Array (catMaybes, mapWithIndex)
import Data.Maybe (Maybe(..))

everyOther :: forall a. Array a -> Array a
everyOther items = catMaybes (mapWithIndex pick items)
  where
    pick i item = if i `mod` 2 == 0 then Just item else Nothing
'''
