function = "gcd"
prompt = """
Return the greatest whole number that divides both positive whole numbers \
a and b. For example, 12, 18 → 6."""

[[tests]]
args = [12, 18]
expected = 6

[[tests]]
args = [7, 5]
expected = 1

[[tests]]
args = [20, 5]
expected = 5

[[tests]]
args = [9, 9]
expected = 9

[javascript]
signature = "gcd(a, b)"
reference = '''
function gcd(a, b) {
  let best = 1;
  for (let d = 1; d <= Math.min(a, b); d++) {
    if (a % d === 0 && b % d === 0) best = d;
  }
  return best;
}
'''

[purescript]
signature = '''
gcd :: Int -> Int -> Int
gcd first second = ...'''
reference = '''
import Prelude

gcd :: Int -> Int -> Int
gcd first second = go (max first second) (min first second)
  where
    go x 0 = x
    go x y = go y (x `mod` y)
'''
