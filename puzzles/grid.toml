function = "grid"
prompt = """
Build a list of rows lists, each holding cols copies of the value. \
For example, 2, 3, 0 → [[0,0,0],[0,0,0]]."""

[[tests]]
args = [2, 3, 0]
expected = [[0, 0, 0], [0, 0, 0]]

[[tests]]
args = [1, 2, "x"]
expected = [["x", "x"]]

[[tests]]
args = [3, 1, true]
expected = [[true], [true], [true]]

[javascript]
signature = "grid(rows, cols, value)"
reference = '''
function grid(rows, cols, value) {
  const result = [];
  for (let r = 0; r < rows; r++) {
    result.push(new Array(cols).fill(value));
  }
  return result;
}
'''

[purescript]
signature = '''
grid :: forall a. Int -> Int -> a -> Array (Array a)
grid rows cols value = ...'''
reference = '''
import Prelude
import Data.Array (replicate)

grid :: forall a. Int -> Int -> a -> Array (Array a)
grid rows cols value = replicate rows row
  where
    row = replicate cols value
'''
