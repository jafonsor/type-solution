function = "isPrime"
signature = "isPrime(n)"
prompt = """
Return true if the whole number n is a prime: greater than 1 and divisible \
only by 1 and itself. For example, isPrime(7) → true, and isPrime(1) → false."""

reference = '''
function isPrime(n) {
  if (n < 2) return false;
  for (let i = 2; i * i <= n; i++) {
    if (n % i === 0) return false;
  }
  return true;
}
'''

[[tests]]
args = [7]
expected = true

[[tests]]
args = [9]
expected = false

[[tests]]
args = [2]
expected = true

[[tests]]
args = [97]
