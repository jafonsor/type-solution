function = "isPrime"
prompt = """
Return true if the whole number n is a prime: greater than 1 and divisible \
only by 1 and itself. For example, isPrime(7) → true, and isPrime(1) → false."""

[[tests]]
args = [7]
expected = true

[[tests]]
args = [9]
expected = false

[[tests]]
args = [2]
expected = true

[[tests]]
args = [97]
expected = true

[[tests]]
args = [1]
expected = false

[javascript]
signature = "isPrime(n)"
reference = '''
function isPrime(n) {
  if (n < 2) return false;
  for (let i = 2; i * i <= n; i++) {
    if (n % i === 0) return false;
  }
  return true;
}
'''

[purescript]
signature = '''
isPrime :: Int -> Boolean
isPrime n = ...'''
reference = '''
import Prelude
import Data.Array (range, takeWhile)
import Data.Foldable (all)

isPrime :: Int -> Boolean
isPrime n = n > 1 && all (\d -> n `mod` d /= 0) candidates
  where
    candidates = takeWhile (\d -> d * d <= n) $ range 2 n
'''
