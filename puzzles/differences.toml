function = "differences"
prompt = """
Return each number minus the one before it, so the result is one item \
shorter; a single number gives []. For example, \
[1,4,9,16] → [3,5,7]."""

[[tests]]
args = [[1, 4, 9, 16]]
expected = [3, 5, 7]

[[tests]]
args = [[10, 7, 7, 12]]
expected = [-3, 0, 5]

[[tests]]
args = [[5]]
expected = []

[javascript]
signature = "differences(nums)"
reference = '''
function differences(nums) {
  const result = [];
  for (let i = 1; i < nums.length; i++) {
    result.push(nums[i] - nums[i - 1]);
  }
  return result;
}
'''

[purescript]
signature = '''
differences :: Array Int -> Array Int
differences nums = ...'''
reference = '''
import Prelude
import Data.Array (drop, zipWith)

differences :: Array Int -> Array Int
differences nums = zipWith (-) later nums
  where
    later = drop 1 nums
'''
