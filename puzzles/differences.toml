function = "differences"
signature = "differences(nums)"
prompt = """
Return each number minus the one before it, so the result is one item \
shorter; a single number gives []. For example, \
differences([1,4,9,16]) → [3,5,7]."""

reference = '''
function differences(nums) {
  const result = [];
  for (let i = 1; i < nums.length; i++) {
    result.push(nums[i] - nums[i - 1]);
  }
  return result;
}
'''

[[tests]]
args = [[1, 4, 9, 16]]
expected = [3, 5, 7]

[[tests]]
args = [[10, 7, 7, 12]]
expected = [-3, 0, 5]

[[tests]]
args = [[5]]
expected = []
