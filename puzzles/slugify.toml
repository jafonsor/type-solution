function = "slugify"
prompt = """
Turn a title into a lower-case slug: its words joined by hyphens. Words are \
separated by spaces, sometimes several in a row or at either end. \
For example, "Hello Big  World " → "hello-big-world"."""

[[tests]]
args = ["Hello Big  World "]
expected = "hello-big-world"

[[tests]]
args = ["Type Solution"]
expected = "type-solution"

[[tests]]
args = ["  Many   spaces here"]
expected = "many-spaces-here"

[[tests]]
args = ["Single"]
expected = "single"

[javascript]
signature = "slugify(title)"
reference = '''
function slugify(title) {
  return title
    .toLowerCase()
    .split(' ')
    .filter((word) => word !== '')
    .join('-');
}
'''

[purescript]
signature = '''
slugify :: String -> String
slugify title = ...'''
reference = '''
import Prelude
import Data.Array (filter)
import Data.String (Pattern(..), split, toLower)
import Data.String.Common (joinWith)

slugify :: String -> String
slugify title = title # toLower # split (Pattern " ") # filter notEmpty # joinWith "-"
  where
    notEmpty word = word /= ""
'''
