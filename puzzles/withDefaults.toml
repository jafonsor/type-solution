function = "withDefaults"
prompt = """
Return a new object with every key of defaults and of options; where both \
have a key, the value from options wins. For example, \
{size: 2}, {size: 1, color: "red"} → {size: 2, color: "red"}."""

[[tests]]
args = [{ size = 2 }, { size = 1, color = "red" }]
expected = { size = 2, color = "red" }

[[tests]]
args = [{ mute = true }, { volume = 5 }]
expected = { mute = true, volume = 5 }

[[tests]]
args = [{}, { theme = "dark" }]
expected = { theme = "dark" }

[javascript]
signature = "withDefaults(options, defaults)"
reference = '''
function withDefaults(options, defaults) {
  const result = { ...defaults };
  for (const key in options) {
    result[key] = options[key];
  }
  return result;
}
'''

[purescript]
signature = '''
withDefaults :: forall a b c d. Union a b c => Nub c d => Record a -> Record b -> Record d
withDefaults options defaults = ...'''
reference = '''
import Prim.Row (class Nub, class Union)
import Record (merge)

withDefaults :: forall a b c d. Union a b c => Nub c d => Record a -> Record b -> Record d
withDefaults options defaults = result
  where
    result = merge options defaults
'''
