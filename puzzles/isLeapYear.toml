function = "isLeapYear"
prompt = """
Return true if the year is a leap year: divisible by 4, except that a year \
divisible by 100 must also be divisible by 400. For example, \
2024 → true, and 1900 → false."""

[[tests]]
args = [2024]
expected = true

[[tests]]
args = [2023]
expected = false

[[tests]]
args = [1900]
expected = false

[[tests]]
args = [2000]
expected = true

[javascript]
signature = "isLeapYear(year)"
reference = '''
function isLeapYear(year) {
  const byFour = year % 4 === 0;
  const byHundred = year % 100 === 0;
  return byFour && (!byHundred || year % 400 === 0);
}
'''

[purescript]
signature = '''
isLeapYear :: Int -> Boolean
isLeapYear year = ...'''
reference = '''
import Prelude

isLeapYear :: Int -> Boolean
isLeapYear year = byFour && (not byHundred || byFourHundred)
  where
    byFour = year `mod` 4 == 0
    byHundred = year `mod` 100 == 0
    byFourHundred = year `mod` 400 == 0
'''
