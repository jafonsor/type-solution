function = "wrapTag"
prompt = """
Wrap the text in an opening and a closing HTML tag with the given name. \
For example, "b", "hi" → "<b>hi</b>"."""

[[tests]]
args = ["b", "hi"]
expected = "<b>hi</b>"

[[tests]]
args = ["p", "Hello, world"]
expected = "<p>Hello, world</p>"

[[tests]]
args = ["em", "now"]
expected = "<em>now</em>"

[javascript]
signature = "wrapTag(tag, text)"
reference = '''
function wrapTag(tag, text) {
  const open = `<${tag}>`;
  const close = `</${tag}>`;
  return open + text + close;
}
'''

[purescript]
signature = '''
wrapTag :: String -> String -> String
wrapTag tag text = ...'''
reference = '''
import Prelude

wrapTag :: String -> String -> String
wrapTag tag text = open <> text <> close
  where
    open = "<" <> tag <> ">"
    close = "</" <> tag <> ">"
'''
