function = "percent"
prompt = """
Return part as a percentage of whole, rounded to the nearest whole number; \
a whole of 0 gives 0. For example, percent(1, 3) → 33."""

[[tests]]
args = [1, 3]
expected = 33

[[tests]]
args = [2, 3]
expected = 67

[[tests]]
args = [7, 20]
expected = 35

[[tests]]
args = [5, 5]
expected = 100

[[tests]]
args = [4, 0]
expected = 0

[javascript]
signature = "percent(part, whole)"
reference = '''
function percent(part, whole) {
  if (whole === 0) return 0;
  const ratio = part / whole;
  return Math.round(ratio * 100);
}
'''

[purescript]
signature = '''
percent :: Int -> Int -> Int
percent part whole = ...'''
reference = '''
import Prelude
import Data.Int (round, toNumber)

percent :: Int -> Int -> Int
percent part whole
  | whole == 0 = 0
  | otherwise = round $ toNumber part * 100.0 / toNumber whole
'''
