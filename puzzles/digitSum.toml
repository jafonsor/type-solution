function = "digitSum"
signature = "digitSum(n)"
prompt = """
Add up the digits of a whole number that is zero or more. For example, \
digitSum(472) → 13, and digitSum(0) → 0."""

reference = '''
function digitSum(n) {
  let total = 0;
  while (n > 0) {
    total += n % 10;
    n = Math.floor(n / 10);
  }
  return total;
}
'''

[[tests]]
args = [472]
expected = 13

[[tests]]
args = [9999]
expected = 36

[[tests]]
args = [5]
expected = 5

[[tests]]
args = [0]
expected = 0
