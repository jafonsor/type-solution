function = "baseName"
prompt = """
Return the file name at the end of a /-separated path, without its \
extension (from the last dot on); a name with no dot stays whole. \
For example, baseName("/home/ada/notes.txt") → "notes"."""

[[tests]]
args = ["/home/ada/notes.txt"]
expected = "notes"

[[tests]]
args = ["backups/site.tar.gz"]
expected = "site.tar"

[[tests]]
args = ["/usr/bin/node"]
expected = "node"

[[tests]]
args = ["readme.md"]
expected = "readme"

[javascript]
signature = "baseName(path)"
reference = '''
function baseName(path) {
  const parts = path.split('/');
  const file = parts[parts.length - 1];
  const dot = file.lastIndexOf('.');
  return dot === -1 ? file : file.slice(0, dot);
}
'''

[purescript]
signature = '''
baseName :: String -> String
baseName path = ...'''
reference = '''
import Prelude
import Data.Array (last)
import Data.Maybe (Maybe(..), fromMaybe)
import Data.String (Pattern(..), lastIndexOf, split, take)

baseName :: String -> String
baseName path = case lastIndexOf (Pattern ".") file of
  Just dot -> take dot file
  Nothing -> file
  where
    file = fromMaybe path (last (split (Pattern "/") path))
'''
