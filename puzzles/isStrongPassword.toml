function = "isStrongPassword"
prompt = """
Return true if the password has at least 8 characters, at least one digit \
and at least one upper-case letter. For example, \
isStrongPassword("Secret123") → true."""

[[tests]]
args = ["Secret123"]
expected = true

[[tests]]
args = ["secret123"]
expected = false

[[tests]]
args = ["LongPassword"]
expected = false

[[tests]]
args = ["Short1A"]
expected = false

[[tests]]
args = ["ABCDEFG1"]
expected = true

[javascript]
signature = "isStrongPassword(pw)"
reference = '''
function isStrongPassword(pw) {
  const longEnough = pw.length >= 8;
  const hasDigit = /[0-9]/.test(pw);
  const hasUpper = /[A-Z]/.test(pw);
  return longEnough && hasDigit && hasUpper;
}
'''

[purescript]
signature = '''
isStrongPassword :: String -> Boolean
isStrongPassword pw = ...'''
reference = '''
import Prelude
import Data.Foldable (any)
import Data.String (length)
import Data.String.CodeUnits (toCharArray)

isStrongPassword :: String -> Boolean
isStrongPassword pw = checks.long && checks.digit && checks.upper
  where
    chars = toCharArray pw
    checks =
      { long: length pw >= 8
      , digit: any (\c -> c >= '0' && c <= '9') chars
      , upper: any (\c -> c >= 'A' && c <= 'Z') chars
      }
'''
