function = "isStrongPassword"
signature = "isStrongPassword(pw)"
prompt = """
Return true if the password has at least 8 characters, at least one digit \
and at least one upper-case letter. For example, \
isStrongPassword("Secret123") → true."""

reference = '''
function isStrongPassword(pw) {
  const longEnough = pw.length >= 8;
  const hasDigit = /[0-9]/.test(pw);
  const hasUpper = /[A-Z]/.test(pw);
  return longEnough && hasDigit && hasUpper;
}
'''

[[tests]]
args = ["Secret123"]
expected = true

[[tests]]
args = ["secret123"]
expected = false

[[tests]]
args = ["LongPassword"]
expected = false

[[tests]]
args = ["Short1A"]
expected = false

[[tests]]
args = ["ABCDEFG1"]
expected = true
