function = "invert"
prompt = """
Swap an object's keys and values; the values are distinct strings. \
For example, invert({a: "x", b: "y"}) → {x: "a", y: "b"}."""

[[tests]]
args = [{ a = "x", b = "y" }]
expected = { x = "a", y = "b" }

[[tests]]
args = [{ red = "stop", green = "go", amber = "wait" }]
expected = { stop = "red", go = "green", wait = "amber" }

[[tests]]
args = [{}]
expected = {}

[javascript]
signature = "invert(obj)"
reference = '''
function invert(obj) {
  const result = {};
  for (const [key, value] of Object.entries(obj)) {
    result[value] = key;
  }
  return result;
}
'''

