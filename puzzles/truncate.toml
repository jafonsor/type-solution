function = "truncate"
prompt = """
Shorten a text longer than max characters to exactly max characters, the \
last three being "..."; a text of max characters or fewer stays as it is. \
For example, "Hello world", 8 → "Hello..."."""

[[tests]]
args = ["Hello world", 8]
expected = "Hello..."

[[tests]]
args = ["The quick brown fox", 10]
expected = "The qui..."

[[tests]]
args = ["exactly", 7]
expected = "exactly"

[[tests]]
args = ["Hi", 5]
expected = "Hi"

[javascript]
signature = "truncate(text, max)"
reference = '''
function truncate(text, max) {
  if (text.length <= max) {
    return text;
  }
  return text.slice(0, max - 3) + '...';
}
'''

[purescript]
signature = '''
truncate :: String -> Int -> String
truncate text limit = ...'''
reference = '''
import Prelude
import Data.String (length, take)

truncate :: String -> Int -> String
truncate text limit
  | length text <= limit = text
  | otherwise = take (limit - 3) text <> "..."
'''
